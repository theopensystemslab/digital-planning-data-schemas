name: PR Workflow

permissions:
  pull-requests: read

on:
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.14.0'

      - name: Install Dependencies
        run: pnpm install

      - name: Run Tests
        run: pnpm test
